<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw Circles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #1a1a1e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #e4e4e7;
  }

  .container {
    background: #25252b;
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-width: 800px;
    width: 100%;
    margin: 1rem;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .header h1 span { color: #a78bfa; }

  .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #71717a;
  }

  .canvas-wrap {
    position: relative;
    background: #1a1a1e;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #3f3f46;
  }

  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    cursor: crosshair;
    touch-action: none;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: center;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid #3f3f46;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .tool-group label {
    font-size: 0.7rem;
    font-weight: 500;
    color: #a1a1aa;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 4px;
    border-radius: 2px;
    background: #3f3f46;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #a78bfa;
    cursor: pointer;
    border: 2px solid #1a1a1e;
  }

  input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border: 2px solid #3f3f46;
    border-radius: 6px;
    cursor: pointer;
    background: none;
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
  }

  input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 4px;
  }

  .radius-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #a78bfa;
    min-width: 2ch;
    text-align: right;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 0.4rem 0.75rem;
    border-radius: 6px;
    border: 1px solid #3f3f46;
    background: #2f2f37;
    color: #e4e4e7;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .btn:hover { background: #3f3f46; border-color: #52525b; }
  .btn:active { transform: scale(0.96); }

  .btn-danger:hover {
    background: #7f1d1d;
    border-color: #b91c1c;
    color: #fca5a5;
  }

  .btn-undo:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .btn-fill {
    background: #4c1d95;
    border-color: #6d28d9;
    color: #c4b5fd;
  }

  .btn-fill:hover {
    background: #5b21b6;
  }

  .btn-fill.active {
    background: #6d28d9;
    border-color: #8b5cf6;
    color: #e4e4e7;
  }

  @media (max-width: 500px) {
    .container { padding: 1rem; margin: 0.5rem; border-radius: 12px; }
    .toolbar { gap: 0.5rem; }
    input[type="range"] { width: 60px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>○ <span>Draw Circles</span></h1>
    <div class="stats"><span id="circle-count">0</span> circles</div>
  </div>

  <div class="canvas-wrap">
    <canvas id="canvas" width="800" height="500"></canvas>
  </div>

  <div class="toolbar">
    <div class="tool-group">
      <label>Radius</label>
      <input type="range" id="radius" min="5" max="100" value="30">
      <span class="radius-value" id="radius-display">30</span>
    </div>

    <div class="tool-group">
      <label>Color</label>
      <input type="color" id="color" value="#a78bfa">
    </div>

    <div class="tool-group">
      <button class="btn btn-fill" id="btn-fill">Fill</button>
    </div>

    <div style="flex:1"></div>

    <button class="btn btn-undo" id="btn-undo" disabled>↩ Undo</button>
    <button class="btn btn-danger" id="btn-clear">✕ Clear</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const radiusInput = document.getElementById('radius');
const radiusDisplay = document.getElementById('radius-display');
const colorInput = document.getElementById('color');
const btnFill = document.getElementById('btn-fill');
const btnUndo = document.getElementById('btn-undo');
const btnClear = document.getElementById('btn-clear');
const circleCount = document.getElementById('circle-count');

let circles = [];
let fillEnabled = false;

function drawCircle(x, y, r, color, fill) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
  if (fill) {
    ctx.fillStyle = color + '30';
    ctx.fill();
  }
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const c of circles) {
    drawCircle(c.x, c.y, c.r, c.color, c.fill);
  }
  circleCount.textContent = circles.length;
  btnUndo.disabled = circles.length === 0;
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function addCircle(pos) {
  const r = parseInt(radiusInput.value);
  const color = colorInput.value;
  circles.push({ x: pos.x, y: pos.y, r, color, fill: fillEnabled });
  redraw();
}

canvas.addEventListener('click', (e) => {
  addCircle(getPos(e));
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  addCircle(getPos(e));
}, { passive: false });

radiusInput.addEventListener('input', () => {
  radiusDisplay.textContent = radiusInput.value;
});

colorInput.addEventListener('input', () => {
  if (circles.length === 0) return;
  const color = colorInput.value;
  for (const c of circles) { c.color = color; }
  redraw();
});

btnFill.addEventListener('click', () => {
  fillEnabled = !fillEnabled;
  btnFill.classList.toggle('active', fillEnabled);
  if (circles.length > 0) {
    for (const c of circles) { c.fill = fillEnabled; }
    redraw();
  }
});

btnUndo.addEventListener('click', () => {
  circles.pop();
  redraw();
});

btnClear.addEventListener('click', () => {
  if (circles.length === 0) return;
  circles = [];
  redraw();
});
</script>

</body>
</html>
