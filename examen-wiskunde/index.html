<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wiskunde Examen Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --card:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.09);
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#60a5fa;
    --accent2:#8b5cf6;
    --success:#22c55e;
}

.light{
    --bg:#f8fafc;
    --card:rgba(255,255,255,.85);
    --border:rgba(15,23,42,.08);
    --text:#0f172a;
    --muted:#64748b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition:.3s;
}

/* Background Glows */

.glow{
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    pointer-events:none;
}

.glow1{
    width:500px;
    height:500px;
    background:#2563eb55;
    top:-150px;
    left:-100px;
}

.glow2{
    width:500px;
    height:500px;
    background:#7c3aed55;
    right:-150px;
    top:150px;
}

.glow3{
    width:450px;
    height:450px;
    background:#0891b255;
    bottom:-200px;
    left:30%;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:40px 24px;
    position:relative;
    z-index:2;
}

/* HERO */

.hero{
    text-align:center;
    margin-bottom:40px;
}

.hero h1{
    font-size:clamp(3rem,8vw,6rem);
    font-weight:800;
    line-height:1;
    background:linear-gradient(90deg,#60a5fa,#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:var(--muted);
    margin-top:15px;
    font-size:1.1rem;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px;
}

.label{
    color:var(--muted);
    font-size:.9rem;
}

.value{
    font-size:2rem;
    font-weight:700;
    margin-top:8px;
}

.progress{
    height:12px;
    background:rgba(255,255,255,.08);
    border-radius:999px;
    overflow:hidden;
    margin-top:16px;
}

.progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#60a5fa,#8b5cf6);
    transition:.4s;
}

/* BUTTON */

.topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:25px;
}

.btn{
    border:none;
    cursor:pointer;
    padding:12px 18px;
    border-radius:14px;
    color:white;
    font-weight:600;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

/* TIMELINE */

.timeline{
    display:grid;
    gap:18px;
}

.day{
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:24px;
    padding:24px;
    transition:.3s;
}

.day:hover{
    transform:translateY(-4px);
}

.day-header{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.date{
    color:var(--accent);
    font-weight:600;
}

.tasks{
    display:grid;
    gap:10px;
}

.task{
    display:flex;
    gap:12px;
    align-items:flex-start;
}

.task input{
    margin-top:4px;
    transform:scale(1.2);
}

.done{
    text-decoration:line-through;
    opacity:.5;
}

.rest{
    border-left:4px solid #ef4444;
}

.exam{
    border-left:4px solid #22c55e;
}

.today{
    box-shadow:0 0 0 1px #60a5fa;
}

.footer{
    text-align:center;
    margin-top:40px;
    color:var(--muted);
}

</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="container">

<div class="topbar">
<button id="themeBtn" class="btn">Thema wisselen</button>
</div>

<section class="hero">
<h1>Wiskunde</h1>
<p>Examen op 17 juni • Project 2, 3 en 4</p>
</section>

<div class="grid">

<div class="card">
<div class="label">Countdown</div>
<div id="countdown" class="value">...</div>
</div>

<div class="card">
<div class="label">Voortgang</div>
<div id="percentage" class="value">0%</div>

<div class="progress">
<div id="progressBar" class="progress-fill"></div>
</div>
</div>

<div class="card">
<div class="label">Doel</div>
<div class="value">17 juni</div>
<p style="margin-top:10px;color:var(--muted)">
Geen studie op vrijdag.
</p>
</div>

</div>

<div class="timeline" id="planner"></div>

<div class="footer">
Succes met je examenvoorbereiding.
</div>

</div>

<script>

const schedule = [

["4 juni","Basisbegrippen functies",[
"Functies",
"Domein en bereik",
"Nulpunten",
"Tekenverloop"
]],

["5 juni","Basisbegrippen functies II",[
"Verloopschema",
"Extrema",
"Symmetrie",
"Oefeningen"
]],

["6 juni","Rustdag",["Vrije dag"],"rest"],

["7 juni","Eerstegraadsfuncties",[
"Richtingscoëfficiënt",
"Grafieken",
"Voorschriften"
]],

["8 juni","Eerstegraadsfuncties II",[
"Tekentabellen",
"Punten controleren",
"Oefeningen"
]],

["9 juni","Vergelijkingen en ongelijkheden",[
"Vergelijkingen",
"Ongelijkheden",
"Grafisch oplossen"
]],

["10 juni","Pythagoras",[
"Stelling",
"Omgekeerde stelling",
"Afstandsformule"
]],

["11 juni","Pythagoras in de ruimte",[
"Ruimtediagonaal",
"Piramides",
"Oefeningen"
]],

["12 juni","Goniometrie",[
"Sinus",
"Cosinus",
"Tangens",
"Vraagstukken"
]],

["13 juni","Rustdag",["Vrije dag"],"rest"],

["14 juni","Ontbinden in factoren",[
"Gemeenschappelijke factor",
"Merkwaardige producten",
"Oefeningen"
]],

["15 juni","Merkwaardige lijnen",[
"Zwaartelijnen",
"Bissectrices",
"Ingeschreven cirkel",
"Omgeschreven cirkel"
]],

["16 juni","Herhaling",[
"Oude toetsen",
"Thales",
"Metrische betrekkingen",
"Lastige oefeningen"
]],

["17 juni","EXAMEN",[
"Materiaal controleren",
"Examen"
],"exam"]

];

const planner = document.getElementById("planner");

schedule.forEach((day,index)=>{

const card=document.createElement("div");
card.className="day";

if(day[3]) card.classList.add(day[3]);

let html=`
<div class="day-header">
<div>
<h2>${day[1]}</h2>
<div class="date">${day[0]}</div>
</div>
</div>
<div class="tasks">
`;

day[2].forEach((task,t)=>{

html+=`
<label class="task">
<input type="checkbox" data-id="${index}-${t}">
<span>${task}</span>
</label>
`;

});

html+=`</div>`;
card.innerHTML=html;
planner.appendChild(card);

});

const checkboxes=document.querySelectorAll("input[type=checkbox]");

function save(){

const data=[];

checkboxes.forEach(c=>{
data.push(c.checked);
});

localStorage.setItem("examPlanner",JSON.stringify(data));

updateProgress();
}

function load(){

const data=JSON.parse(
localStorage.getItem("examPlanner")||"[]"
);

checkboxes.forEach((c,i)=>{

if(data[i]){
c.checked=true;
c.nextElementSibling.classList.add("done");
}

});

updateProgress();
}

document.addEventListener("change",(e)=>{

if(e.target.type==="checkbox"){

e.target.nextElementSibling.classList.toggle(
"done",
e.target.checked
);

save();

}

});

function updateProgress(){

const total=checkboxes.length;

const done=document.querySelectorAll(
"input:checked"
).length;

const percent=Math.round(done/total*100);

document.getElementById("percentage").textContent=
percent+"%";

document.getElementById("progressBar").style.width=
percent+"%";
}

function countdown(){

const exam=new Date("2026-06-17T09:00:00");
const now=new Date();

const diff=exam-now;

const days=Math.max(
0,
Math.ceil(diff/(1000*60*60*24))
);

document.getElementById("countdown").textContent=
days+" dagen";
}

countdown();
load();

document.getElementById("themeBtn")
.addEventListener("click",()=>{

document.body.classList.toggle("light");

localStorage.setItem(
"theme",
document.body.classList.contains("light")
? "light"
: "dark"
);

});

if(localStorage.getItem("theme")==="light"){
document.body.classList.add("light");
}

</script>

</body>
</html>
